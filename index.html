<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E96848" />

    <!-- ROUTE_META_START -->
    <!-- Route-specific metadata is generated from src/data/routeMeta.ts after every production build. -->
    <!-- ROUTE_META_END -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Self-hosted fonts (eliminates Google Fonts render-blocking) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Editorial serif : Lora for homepage headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

    <!-- Preloader: add is-loading class before React mounts to prevent white flash -->
    <script>
      (function () {
        try {
          if (
            window.location.pathname === '/' &&
            !document.hidden &&
            !sessionStorage.getItem('preloader_shown') &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            document.documentElement.classList.add('is-loading');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
